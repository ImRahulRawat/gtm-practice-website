
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Thank You | Insurance Demo</title>

    <!-- Google Tag Manager -->
    <!-- Add your existing GTM head snippet here -->
    <!-- End Google Tag Manager -->

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
        rel="stylesheet">

    <style>
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f7fa;
            font-family: Arial, sans-serif;
        }

        .thankyou-card {
            max-width: 520px;
            width: 100%;
            background: #fff;
            padding: 45px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
        }

        .success-icon {
            width: 80px;
            height: 80px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #e7f8ee;
            color: #198754;
            border-radius: 50%;
            font-size: 40px;
        }

        .thankyou-card h1 {
            color: #1f2937;
            font-size: 30px;
            font-weight: 700;
        }

        .thankyou-card p {
            color: #6b7280;
            line-height: 1.7;
        }

        .home-btn {
            background: #1981fc;
            color: #fff;
            border: none;
            padding: 12px 26px;
            border-radius: 50px;
            text-decoration: none;
            display: inline-block;
            margin-top: 12px;
        }

        .home-btn:hover {
            background: #0457c1;
            color: #fff;
        }
    </style>
</head>

<body>

    <!-- Google Tag Manager (noscript) -->
    <!-- Add your existing GTM noscript snippet here -->
    <!-- End Google Tag Manager (noscript) -->

    <div class="container px-3">
        <div class="thankyou-card mx-auto">

            <div class="success-icon">
                <i class="bi bi-check-lg"></i>
            </div>

            <h1>Thank You!</h1>

            <p class="mt-3">
                Your demo form has been submitted successfully.
                Thank you for your interest in our insurance services.
            </p>

            <p>
                This is a demo website. No personal information
                has been sent to or stored on a server.
            </p>

            <a href="index.html" class="home-btn">
                <i class="bi bi-house-door me-2"></i>
                Back to Home
            </a>

        </div>
    </div>

</body>
</html>
